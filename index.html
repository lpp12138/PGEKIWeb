<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongeki-IO Controller</title>
    <link inline rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1>Ongeki-IO Controller</h1>
        </div>
        <div class="header-right">
            <div class="connection-status">
                <span id="connection-status">未连接</span>
                <div class="status-indicator" id="status-indicator"></div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- 摇杆组件 -->
        <div class="joystick-container">
            <div class="joystick-base">
                <div class="joystick-stick" id="joystick-stick">
                    <div class="joystick-knob"></div>
                </div>
                <div class="joystick-center-line"></div>
            </div>
            <div class="joystick-info">
                <span id="joystick-lever-value">Lever: 0</span>
            </div>
        </div>

        <!-- 按键控制区域 -->
        <div class="button-control-area">
            <h2>按键控制</h2>
            <div class="button-grid">
                <button class="control-button" data-button="0">按键 1</button>
                <button class="control-button" data-button="1">按键 2</button>
                <button class="control-button" data-button="2">按键 3</button>
                <button class="control-button" data-button="3">按键 4</button>
                <button class="control-button" data-button="4">按键 5</button>
                <button class="control-button" data-button="5">按键 6</button>
                <button class="control-button" data-button="6">按键 7</button>
                <button class="control-button" data-button="7">按键 8</button>
                <button class="control-button" data-button="8">按键 9</button>
                <button class="control-button" data-button="9">按键 10</button>
            </div>
        </div>

        <!-- 特殊按键 -->
        <div class="special-buttons">
            <button class="special-button" id="test-button">Test</button>
            <button class="special-button" id="service-button">Service</button>
        </div>

        <!-- 连接设置 -->
        <div class="connection-settings">
            <h2>连接设置</h2>
            <div class="setting-group">
                <label for="server-ip">服务器IP:</label>
                <input type="text" id="server-ip" value="127.0.0.1" placeholder="127.0.0.1">
            </div>
            <div class="setting-group">
                <label for="server-port">端口:</label>
                <input type="number" id="server-port" value="10000" placeholder="10000">
            </div>
            <button id="connect-button" class="connect-btn">连接</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
